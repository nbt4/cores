# Optional overrides for the backup service already included in docker-compose.yml.
# docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d db-backup
services:
  db-backup:
    image: nobentie/cores-backup:1.0.0
    environment:
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_WEBDAV_URL: "${BACKUP_WEBDAV_URL:-}"
