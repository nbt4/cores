name: Verify Cores suite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [cores-common, cores-dashboard, cores-mcp, rentalcore, warehousecore, plannercore, procurementcore]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - uses: actions/setup-node@v4
        if: matrix.service != 'cores-common' && matrix.service != 'cores-mcp'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/web/package-lock.json
      - name: Build frontend and run available frontend tests
        if: matrix.service != 'cores-common' && matrix.service != 'cores-mcp'
        working-directory: ${{ matrix.service }}/web
        run: |
          npm ci
          npm run build
          npm test --if-present
      - name: Backend tests and static checks
        working-directory: ${{ matrix.service }}
        run: |
          go test ./... -timeout 120s
          go vet ./...
      - name: Suite contracts
        if: matrix.service == 'cores-common'
        run: |
          ./scripts/check-design-system.sh
          docker compose config --quiet
          sh scripts/check-release.sh
  mcp-access:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: cores_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: cores-mcp/go.mod
          cache-dependency-path: cores-mcp/go.sum
      - name: Planner isolation through real MCP transport
        working-directory: cores-mcp
        env:
          CORES_MCP_AUTH_TEST_DATABASE_URL: postgres://postgres:isolated-ci-test@localhost:5432/cores_test?sslmode=disable
        run: go test -race ./internal/authn ./internal/mcpserver -timeout 120s
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backup image
        run: docker build -f backup/Dockerfile -t cores-backup-test:stabilization .
      - name: Verify restore and failure paths
        run: sh scripts/test-backup.sh cores-backup-test:stabilization
