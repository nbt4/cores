# Cores reverse-proxy examples
# Choose the same global mode as CORES_ROUTING_MODE. In paths mode keep only
# the dashboard block; in subdomains mode enable the four additional blocks.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared proxy headers for all Cores applications.
# Place this file in /etc/nginx/conf.d/ or copy the relevant server blocks into
# the active site configuration. Add TLS certificates at the ingress layer.

# =============================================================================
# DASHBOARD HOST: required in both modes
# =============================================================================
server {
    listen 80;
    server_name cores.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

# =============================================================================
# PATH MODE: CORES_ROUTING_MODE=paths
# =============================================================================
# No additional server blocks are needed. Cores Dashboard routes all four fixed
# paths to the internal service containers.
# Public routes in path mode:
#   /rentalcore/      -> RentalCore
#   /warehousecore/   -> WarehouseCore
#   /plannercore/     -> PlannerCore, including WebSockets
#   /procurementcore/ -> ProcurementCore

# =============================================================================
# SUBDOMAIN MODE: CORES_ROUTING_MODE=subdomains
# =============================================================================
# Forward every Core subdomain directly to the matching service. Configure all
# *_PUBLIC_URL variables accordingly.
server {
    listen 80;
    server_name rent.example.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

